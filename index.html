            const pct = Math.max(0, Math.min(100, (left / ROUND_MS) * 100));
            elB.style.width = pct.toFixed(1) + '%';
            elB.setAttribute('data-hot', (left <= 5000) ? '1' : '0');
        }
        if (elI) {
            const txt = clockIssue ? pad3(clockIssue) : '---';
            if (elI.textContent !== txt) elI.textContent = txt;
        }
    }

    function betTick() {
        // (khung đặt cược đã bỏ — không còn gì để cập nhật)
        if (!clockIssue) { try { clockIssueFromBoard(); } catch (e) {} }
    }

    // khi máy chủ không trả số kỳ: lấy kỳ kế tiếp của bảng làm "kỳ đang mở"
    function clockIssueFromBoard() {
        if (clockIssue) return clockIssue;
        if (!lastIssue) return '';
        const nx = nextIssueOf(lastIssue);
        clockIssue = nx || lastIssue;
        return clockIssue;
    }

    function clockStart() {
        if (clockTimer) return;
        clockPoll();
        clockTick();
        clockTimer = setInterval(clockTick, 200);
        setInterval(function () { try { betTick(); } catch (e) {} }, 500);
        setInterval(function () { if (!document.hidden) clockPoll(); }, 10000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) clockPoll(); });
    }

    // =====================================================================
    //  TỰ CẬP NHẬT (không cần bấm lại)
    //   · 30 giây/lần hỏi máy chủ 1 trang (100 kỳ mới nhất) nếu có token.
    //   · Không có token → chỉ theo Firebase (onSnapshot tự đẩy kỳ mới về).
    //   · Token hết hạn → báo rõ trên thanh trạng thái.
    // =====================================================================
    const AUTO_MS = 15000;              // nhịp tự cập nhật: chỉ 1 trang ~60 kỳ nên rất nhẹ
    let autoTimer = null;
    let autoBusy = false;

    function tokenLeftMs() {
        const tk = getToken();
        if (!tk) return 0;
        try {
            const m = tk.split('.')[1];
            if (!m) return 0;
            const pay = JSON.parse(atob(m.replace(/-/g, '+').replace(/_/g, '/')));
            const exp = Number(pay.exp) * 1000;
            return exp ? (exp - Date.now()) : 0;
        } catch (e) { return 0; }
    }

    function tokenExpired() {
        const left = tokenLeftMs();
        return !!getToken() && left !== 0 && left <= 0;
    }

    // token chết → nói rõ nguyên nhân, và KHÔNG báo "trễ N kỳ" gây hiểu nhầm
    function showTokenDead() {
        const elSync = document.getElementById('clockSync');
        if (!getToken()) {
            setStatus('Chưa có token — vẫn thử đọc kết quả công khai; nếu máy chủ đòi token thì bấm «Token».', 'warn');
            if (elSync) { elSync.textContent = 'bảng: kỳ ' + pad3(lastIssue || '—') + ' · chưa có token (đang thử đọc công khai)'; elSync.setAttribute('data-ok', '0'); }
            return;
        }
        setStatus('Token đã hết hạn — đang thử đọc công khai; muốn chắc có số mới thì bấm «Token» dán token mới.', 'warn');
        if (elSync) {
            elSync.textContent = 'bảng: kỳ ' + pad3(lastIssue || '—') + ' · TOKEN HẾT HẠN — bấm «Token» để chạy tiếp';
            elSync.setAttribute('data-ok', '0');
        }
    }
    let deadShown = false;

    async function autoRefresh(force) {
        if (autoBusy || busy) return;
        if (document.hidden && !force) return;
        // KHÔNG bắt buộc token: không token vẫn thử đọc công khai (anon);
        // token hết hạn cũng vẫn thử — máy chủ từ chối thì mới báo.
        if (tokenExpired()) deadShown = false;
        autoBusy = true;
        try {
            const before = lastIssue;
            // nhịp định kỳ chỉ xin 60 kỳ mới nhất (1 trang) để cực nhẹ
            const got = await fetchLatest(force ? 120 : 60, 1);
            if (!got || !got.size) return;       // không lấy được gì → giữ nguyên bảng, không coi là "trễ"
            got.forEach(function (dig, iss) { data.set(iss, dig); });
            const keys = Array.from(data.keys()).sort(function (a, b) { return issueGreater(a, b) ? 1 : -1; });
            if (latestGameIssue) lastIssue = latestGameIssue;
            else if (keys.length) lastIssue = keys[keys.length - 1];
            saveData();
            paint();
            if (lastIssue !== before) {
                fbPublishBoard();
                setStatus('Tự cập nhật · kỳ mới nhất ' + pad3(lastIssue) + ' · tổng ' + data.size + ' kỳ.', 'ok');
            }
            try { checkSync(); } catch (e) {}
        } catch (e) {
            if (e && e.kind === 'auth') { deadShown = true; try { showTokenDead(); } catch (x) {} }
        } finally {
            autoBusy = false;
        }
    }


    // Khi sang kỳ mới: chỉ xin ĐÚNG 1 TRANG (≈100 kỳ) để bắt kết quả vừa công bố.
    //   · Không quét nhiều trang, không thử lại dồn dập → không tốn băng thông, không bị chặn.
    let tailTimer = null, tailAt = 0, deepNext = false;
    async function tailRefresh() {
        if (busy || autoBusy || tailTimer) return;
        if (Date.now() - tailAt < 3000) return;
        tailAt = Date.now();
        autoBusy = true;
        try {
            const pageSize = deepNext ? 200 : 120;      // máy chủ có lúc xếp trang cũ→mới → lấy sâu hơn
            const got = await fetchLatest(pageSize, deepNext ? 2 : 1);
            if (!got || !got.size) return;
            const before = lastIssue;
            got.forEach(function (dig, iss) { data.set(iss, dig); });
            const keys = Array.from(data.keys()).sort(function (a, b) { return issueGreater(a, b) ? 1 : -1; });
            if (keys.length) lastIssue = keys[keys.length - 1];
            saveData();
            paint();
            if (lastIssue !== before) {
                fbPublishBoard();
                setStatus('Vừa có kết quả kỳ ' + pad3(lastIssue) + ' · bảng đã cập nhật.', 'ok');
                deepNext = false;
            } else {
                deepNext = true;                        // không thấy kỳ mới → lần sau đọc sâu hơn
            }
            try { checkSync(); } catch (e) {}
        } catch (e) {
            if (e && e.kind === 'auth') { deadShown = true; try { showTokenDead(); } catch (x) {} }
        } finally {
            autoBusy = false;
        }
    }

    // Nhịp thích ứng: bảng đã bắt kịp → 15 giây/lần; còn thiếu kết quả → 5 giây/lần
    // cho tới khi bắt kịp (mỗi lần vẫn chỉ 1 trang ≈100 kỳ nên rất nhẹ).
    let autoLoopTimer = null;
    function autoLoop() {
        if (autoLoopTimer) clearTimeout(autoLoopTimer);
        const behind = boardGap() > 0;
        // không token → vẫn thử đọc công khai nhưng giãn nhịp 20 giây cho nhẹ
        const wait = !getToken() ? (behind ? 10000 : 20000) : (behind ? 5000 : AUTO_MS);
        autoLoopTimer = setTimeout(async function () {
            try { await autoRefresh(behind); } catch (e) {}
            autoLoop();
        }, wait);
    }
    function autoStart() {
        if (autoTimer) return;
        autoTimer = true;
        autoLoopTimer = setTimeout(function () { autoLoop(); }, 2000);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { autoLoop(); setTimeout(tailRefresh, 1200); }
        });
    }

    // =====================================================================
    //  NẠP KẾT QUẢ
    // =====================================================================
    async function doFetch() {
        if (busy) return;
        busy = true;
        setStatus('Đang nạp kết quả…', '');
        try {
            const got = await fetchLatest(TOTAL_CELLS, FETCH_MAX_PAGES);
            let added = 0;
            got.forEach(function (dig, iss) {
                if (!data.has(iss)) { data.set(iss, dig); added++; }
                else data.set(iss, dig);
            });
            const keys = Array.from(data.keys()).sort(function (a, b) { return issueGreater(a, b) ? 1 : -1; });
            // mốc mới nhất: ưu tiên kỳ mới nhất của game vừa đọc được
            if (latestGameIssue) lastIssue = latestGameIssue;
            else lastIssue = keys.length ? keys[keys.length - 1] : '';
            // chỉ giữ đúng 2000 kỳ gần nhất tính từ mốc đó
            const cut = keys.slice(-TOTAL_CELLS);
            saveData();
            paint();
            fbPublishBoard();
            try { checkSync(); } catch (e) {}
            const left = Math.max(0, TOTAL_CELLS - Math.min(TOTAL_CELLS, cut.length));
            const leftTk = tokenLeftMs();
            const tkNote = leftTk > 0 ? (' · token còn ' + Math.floor(leftTk / 3600000) + 'h' + Math.floor((leftTk % 3600000) / 60000) + 'm') : '';
            setStatus('Đã nạp ' + got.size + ' kỳ (mới thêm ' + added + ') · tổng ' + data.size + ' kỳ đã lưu'
                + (left ? ' · còn thiếu ' + left + ' ô (máy chủ trả ~100 kỳ/lần, sẽ tự nạp tiếp).' : ' · bảng đã đầy 2000 ô.')
                + tkNote, 'ok');
        } catch (e) {
            setStatus('Lỗi nạp: ' + (e && e.message ? e.message : e) + (e && e.kind === 'auth' ? ' → dán token mới.' : ''), 'err');
        } finally {
            busy = false;
        }
    }


    // =====================================================================
    //  ĐẶT CƯỢC THỦ CÔNG — vốn ảo 1.000.000
    //   · LỚN = số ≥ 5 · NHỎ = số ≤ 4
    //   · thua → gấp thếp lên mức cược kế tiếp
    //   · thắng → quay về mức 1
    //   · thua ở mức cao nhất → dừng, về mức 1
    // =====================================================================
    const BET_LS = 'vn168_bet_v2';
    const BET_START = 1000000;
    const BET_DEFAULT_LEVELS = [10000, 25000, 60000, 150000, 350000, 600000];
    const betState = {
        bal: BET_START,
        levels: BET_DEFAULT_LEVELS.slice(),
        lv: 0,
        // LOGIC: sau 1 ván thua → chuyển sang chế độ x-4/x-3
        mode: 'normal',        // 'normal' = theo L/N của kỳ trước · 'rule' = theo x-4 / x-3
        ruleLoss: 0,           // số lần thua liên tiếp ở nhánh x-4 (đủ 2 → quay về L/N)
        auto: false,           // bật tự động cược
        pending: null,         // { issue, side, lv, stake, mode, why }
        hist: []
    };

    function betFmt(n) {
        const v = Math.round(Number(n) || 0);
        return String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // NHẬP THEO ĐƠN VỊ NGHÌN: "600" → 600.000 · "1200" → 1.200.000
    function betCoin(txt) {
        const raw = String(txt || '').trim();
        const digits = raw.replace(/[^\d]/g, '');
        if (!digits) return 0;
        const n = Number(digits);
        if (!isFinite(n) || n <= 0) return 0;
        if (raw.indexOf('.') >= 0 || raw.indexOf(',') >= 0) return n;
        if (digits.length >= 7) return n;
        return n * 1000;
    }

    function betShort(n) {
        const v = Math.round(Number(n) || 0);
        if (v >= 1000 && v % 1000 === 0) return String(v / 1000);
        return betFmt(v);
    }

    function betSave() {
        try {
            localStorage.setItem(BET_LS, JSON.stringify({
                bal: betState.bal, levels: betState.levels, lv: betState.lv,
                mode: betState.mode, ruleLoss: betState.ruleLoss, auto: betState.auto,
                pending: betState.pending, hist: betState.hist.slice(0, 30)
            }));
        } catch (e) {}
    }

    function betLoad() {
        let o = null;
        try { o = JSON.parse(localStorage.getItem(BET_LS) || 'null'); } catch (e) {}
        if (!o) return;
        if (isFinite(o.bal)) betState.bal = Number(o.bal);
        if (Array.isArray(o.levels)) {
            const lv = o.levels.map(Number).filter(function (x) { return isFinite(x) && x > 0; });
            if (lv.length) betState.levels = lv;
        }
        if (isFinite(o.lv)) betState.lv = Math.max(0, Math.min(betState.levels.length - 1, Number(o.lv)));
        if (o.mode === 'rule' || o.mode === 'normal') betState.mode = o.mode;
        if (isFinite(o.ruleLoss)) betState.ruleLoss = Number(o.ruleLoss);
        betState.auto = !!o.auto;
        // CHỈ 1 LẦN: dọn vé đang chờ của phiên bản cũ (logic sai) rồi thôi
        // (nếu chạy mỗi lần mở trang thì vé mới cũng bị xoá → không bao giờ chốt được)
        let migrated = false;
        try { migrated = localStorage.getItem('vn168_bet_v3') === '1'; } catch (e) {}
        if (o.pending && o.pending.issue) {
            if (migrated) {
                betState.pending = o.pending;
            } else if (Number(o.pending.stake) > 0) {
                betState.bal += Number(o.pending.stake);
            }
        }
        try { localStorage.setItem('vn168_bet_v3', '1'); } catch (e) {}
        if (Array.isArray(o.hist)) betState.hist = o.hist.slice(0, 30);
    }

    // kỳ để đặt cược = kỳ ĐANG CHẠY (đồng hồ) nếu kỳ đó chưa có kết quả
    function betNewestIssue() {
        const open = (typeof clockIssue === 'string') ? clockIssue : '';
        if (open && !data.has(open)) return open;
        let best = '';
        data.forEach(function (v, k) {
            if (v === undefined || v === null || v === '') return;
            const ks = String(k);
            if (!best || issueGreater(ks, best)) best = ks;
        });
        if (!best && typeof lastIssue === 'string') best = lastIssue;
        return best;
    }

    // kỳ SẮP MỞ (chưa có kết quả) để đặt cược
    function betNextOpenIssue() {
        const open = (typeof clockIssue === 'string') ? clockIssue : '';
        if (open && !data.has(open)) return open;
        const done = betLastDone();
        if (!done) return '';
        const t = String(done);
        if (!/^\d+$/.test(t)) return '';
        try {
            const n = BigInt(t) + 1n;
            let str = n.toString();
            while (str.length < t.length) str = '0' + str;
            return str;
        } catch (e) { return ''; }
    }

    // kỳ lớn nhất đã có kết quả
    function betLastDone() {
        let best = '';
        data.forEach(function (v, k) {
            if (v === undefined || v === null || v === '') return;
            const ks = String(k);
            if (!best || issueGreater(ks, best)) best = ks;
        });
        return best;
    }

    // 3 kỳ gần nhất (đã có kết quả): x, x-1, x-4 ; kỳ x+1 là kỳ sắp ra
    function betRecent4() {
        const keys = [];
        data.forEach(function (v, k) {
            if (v === undefined || v === null || v === '') return;
            keys.push(String(k));
        });
        keys.sort(function (a, bb) { return issueGreater(a, bb) ? 1 : -1; });   // cũ → mới
        if (keys.length < 5) return null;
        const n = keys.length;
        const x = keys[n - 1], x1 = keys[n - 2], x3 = keys[n - 4], x4 = keys[n - 5];
        return {
            x: x, x1: x1, x3: x3, x4: x4,
            bx: bitOf(data.get(x)), bx1: bitOf(data.get(x1)),
            bx3: bitOf(data.get(x3)), bx4: bitOf(data.get(x4)),
            dx: Number(data.get(x)), dx1: Number(data.get(x1)),
            dx3: Number(data.get(x3)), dx4: Number(data.get(x4))
        };
    }

    function sideName(bit) { return bit === '1' ? 'LỚN' : (bit === '0' ? 'NHỎ' : '—'); }

    // ============ TÍNH NƯỚC ĐI THEO LOGIC ============
    //  · mặc định (đang thắng / mới bắt đầu): đánh cùng L/N với kỳ x vừa ra
    //  · vừa thua: so vị trí x với x-4
    //      - NGƯỢC nhau  → đánh NGƯỢC với x-3
    //      - TRÙNG nhau  → đánh THEO (trùng) với x-3
    //      - thắng ở nhánh này → quay lại đánh cùng L/N kỳ trước
    function betNextPick() {
        const r = betRecent4();
        if (!r || !r.bx || !r.bx1) return null;
        if (betState.pending) return { side: betState.pending.side, why: 'đang chờ kết quả kỳ ' + pad3(betState.pending.issue), locked: true, r: r };
        if (betState.mode !== 'rule') {
            return {
                side: r.bx, locked: false, r: r,
                why: 'kỳ <b>' + pad3(r.x) + '</b> ra <b>' + r.dx + '</b> (' + sideName(r.bx) + ') → đánh theo: <b>' + sideName(r.bx) + '</b>'
            };
        }
        const sx = r.bx, sx4 = r.bx4, sx3 = r.bx3;
        const same = (sx === sx4);                   // x và x-4 trùng hay ngược
        // GỐC để đánh là vị trí x-3: trùng → đánh TRÙNG với x-3 · ngược → đánh NGƯỢC với x-3
        const side = same ? sx3 : (sx3 === '1' ? '0' : '1');
        return {
            side: side, locked: false, r: r,
            why: 'đang gỡ (thua ' + betState.ruleLoss + ' lần) · so kỳ <b>' + pad3(r.x) + '</b> (' + r.dx + ' ' + sideName(sx)
                + ') với kỳ <b>' + pad3(r.x4) + '</b> (' + r.dx4 + ' ' + sideName(sx4) + ') → <b>' + (same ? 'TRÙNG' : 'NGƯỢC')
                + '</b> ⇒ đánh ' + (same ? 'TRÙNG' : 'NGƯỢC') + ' với kỳ <b>' + pad3(r.x3) + '</b> ('
                + r.dx3 + ' ' + sideName(sx3) + ') ⇒ <b>' + sideName(side) + '</b>'
        };
    }

    function betStatus(msg, kind) {
        const el = $('ebStatus');
        if (!el) return;
        el.textContent = msg;
        if (kind) el.setAttribute('data-kind', kind); else el.removeAttribute('data-kind');
    }

    function betRenderLevels() {
        const box = $('ebSteps');
        if (!box) return;
        const sig = betState.levels.join(',') + '|' + betState.lv;
        if (box.getAttribute('data-sig') === sig) return;
        box.setAttribute('data-sig', sig);
        box.textContent = '';
        const frag = document.createDocumentFragment();
        betState.levels.forEach(function (v, i) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'eb-chip-lv';
            b.textContent = betFmt(v);
            b.title = 'mức ' + (i + 1);
            if (i === betState.lv) b.setAttribute('data-on', '1');
            b.addEventListener('click', function () {
                if (betState.pending) { betStatus('đang chờ kết quả kỳ ' + pad3(betState.pending.issue) + ' — chưa đổi mức được', 'warn'); return; }
                betState.lv = i;
                betSave(); betRender();
            });
            frag.appendChild(b);
        });
        box.appendChild(frag);
    }

    function betRenderHist() {
        const box = $('ebHist');
        const chip = $('ebHChip');
        if (chip) {
            const w = betState.hist.filter(function (h) { return h.win; }).length;
            chip.textContent = betState.hist.length + ' ván · thắng ' + w + '/' + betState.hist.length;
        }
        if (!box) return;
        const sig = betState.hist.map(function (h) { return h.issue + (h.win ? 'W' : 'L'); }).join(',');
        if (box.getAttribute('data-sig') === sig) return;
        box.setAttribute('data-sig', sig);
        box.textContent = '';
        if (!betState.hist.length) {
            const d = document.createElement('div');
            d.className = 'eb-empty';
            d.textContent = 'chưa có ván nào';
            box.appendChild(d);
            return;
        }
        const frag = document.createDocumentFragment();
        betState.hist.forEach(function (h) {
            const row = document.createElement('div');
            row.className = 'eb-hrow';
            row.setAttribute('data-win', h.win ? '1' : '0');
            const side = document.createElement('span');
            side.className = 'eb-hside';
            side.textContent = h.side === 'big' ? 'LỚN' : 'NHỎ';
            const mid = document.createElement('span');
            mid.className = 'eb-hmid';
            mid.textContent = 'kỳ ' + pad3(h.issue) + ' · ra ' + h.digit + ' · mức ' + h.lv
                + (h.mode === 'rule' ? ' · gỡ x-4' : '');
            const res = document.createElement('span');
            res.className = 'eb-hres';
            res.textContent = h.win ? '+' + betFmt(h.stake) : '−' + betFmt(h.stake);
            row.appendChild(side); row.appendChild(mid); row.appendChild(res);
            frag.appendChild(row);
        });
        box.appendChild(frag);
    }

    function betMarkCells() {
        const cells = document.querySelectorAll('#grid .cell[data-bet]');
        for (let i = 0; i < cells.length; i++) cells[i].removeAttribute('data-bet');
        const p = betState.pending;
        if (!p) return;
        const tag = pad3(p.issue);
        const list = document.querySelectorAll('#grid .cell');
        for (let i = 0; i < list.length; i++) {
            const stt = list[i].querySelector('.stt');
            if (stt && stt.textContent === tag) {
                list[i].setAttribute('data-bet', (p.side === 'big' ? 'LỚN ' : 'NHỎ ') + betFmt(p.stake));
                break;
            }
        }
    }

    function betRender() {
        const bal = $('ebBal');
        if (bal) {
            bal.textContent = betFmt(betState.bal);
            if (betState.bal < betState.levels[0]) bal.setAttribute('data-low', '1');
            else bal.removeAttribute('data-low');
        }
        const lv = $('ebLv'), lv2 = $('ebLv2'), lvN = $('ebLvN'), st = $('ebStake');
        if (lv) lv.textContent = String(betState.lv + 1);
        if (lv2) lv2.textContent = String(betState.lv + 1);
        if (lvN) lvN.textContent = String(betState.levels.length);
        const stake = betState.levels[betState.lv] || 0;
        if (st) st.textContent = betFmt(stake);

        // nước đi đề xuất
        let pick = null;
        try { pick = betNextPick(); } catch (e) {}
        const sideEl = $('autoSide'), issEl = $('autoIssue'), whyEl = $('autoWhy');
        if (issEl) issEl.textContent = pad3(betNewestIssue() || '');
        if (sideEl) {
            if (betState.pending) {
                sideEl.textContent = betState.pending.side === 'big' ? 'LỚN' : 'NHỎ';
                sideEl.setAttribute('data-side', betState.pending.side === 'big' ? 'big' : 'small');
            } else if (pick) {
                sideEl.textContent = sideName(pick.side);
                sideEl.setAttribute('data-side', pick.side === '1' ? 'big' : 'small');
            } else {
                sideEl.textContent = '—';
                sideEl.removeAttribute('data-side');
            }
        }
        if (whyEl) {
            // gọn: chỉ hiện lý do khi đang ở nhánh gỡ (x-4), còn lại ẩn
            if (!betState.pending && pick && betState.mode === 'rule' && pick.why) {
                whyEl.innerHTML = pick.why;
                whyEl.hidden = false;
            } else {
                whyEl.hidden = true;
                whyEl.innerHTML = '';
            }
        }

        const cfg = $('ebCfg');
        if (cfg && document.activeElement !== cfg) cfg.value = betState.levels.map(betShort).join(' ');
        const pend = betState.pending;
        const autoBtn = $('ebAuto');
        if (autoBtn) autoBtn.disabled = !!pend || !pick || stake > betState.bal || pick.locked;
        try { betAutoLabel(); } catch (e) {}
        betRenderLevels();
        betRenderHist();
        betMarkCells();
    }

    // chốt ván khi kỳ đã có kết quả
    function betSettle() {
        const p = betState.pending;
        if (!p) return;
        const d = data.get(String(p.issue));
        if (d === undefined || d === '' || d === null) return;
        const digit = Number(d);
        const win = (p.side === 'big') ? (digit >= 5) : (digit < 5);
        betState.bal += win ? p.stake * 2 : 0;

        let note = '';
        const last = betState.levels.length - 1;
        if (win) {
            // THẮNG: về mức 1 + quay lại đánh theo L/N kỳ trước
            betState.lv = 0;
            betState.mode = 'normal';
            betState.ruleLoss = 0;
            note = ' · thắng → về mức 1, đánh theo L/N';
        } else {
            // THUA: luôn GẤP THẾP lên mức kế tiếp (không reset theo nhánh)
            if (p.lv >= last) {
                betState.lv = 0;
                note = ' · thua ở mức cao nhất (' + (last + 1) + '/' + betState.levels.length + ') → dừng, về mức 1';
            } else {
                betState.lv = p.lv + 1;
                note = ' · thua → lên mức ' + (betState.lv + 1) + '/' + betState.levels.length;
            }
            if (betState.mode !== 'rule') {
                betState.mode = 'rule';
                betState.ruleLoss = 1;
                note += ' · chuyển sang so x với x-4 (lần 1)';
            } else {
                betState.ruleLoss += 1;
                if (betState.ruleLoss >= 2) {
                    // thua 2 lần ở nhánh x-4 → bỏ nhánh, quay về đánh theo L/N (MỨC VẪN TĂNG)
                    betState.mode = 'normal';
                    betState.ruleLoss = 0;
                    note += ' · thua 2 lần ở nhánh x-4 → quay về L/N (giữ mức ' + (betState.lv + 1) + ')';
                } else {
                    note += ' · thua tiếp ở nhánh x-4 (lần ' + betState.ruleLoss + ')';
                }
            }
        }
        betState.hist.unshift({
            issue: String(p.issue), side: p.side, lv: p.lv + 1,
            stake: p.stake, digit: digit, win: win, mode: p.mode, bal: betState.bal
        });
        if (betState.hist.length > 30) betState.hist.length = 30;
        betState.pending = null;
        betSave();
        betStatus('kỳ ' + pad3(p.issue) + ' ra ' + digit + ' → '
            + (win ? 'THẮNG +' + betFmt(p.stake) : 'THUA −' + betFmt(p.stake)) + note
            + ' · vốn ' + betFmt(betState.bal), win ? 'win' : 'lose');
        try { betRender(); } catch (e) {}
    }

    function paintBetRows() { try { betMarkCells(); } catch (e) {} }

    // hiện kết quả L/N của kỳ gần nhất lên thanh trên
    function paintLastLabel() {
        const el = $('lastRes');
        if (!el) return;
        const keys = [];
        data.forEach(function (v, k) {
            if (v === undefined || v === null || v === '') return;
            keys.push(String(k));
        });
        if (!keys.length) { el.textContent = '—'; return; }
        keys.sort(function (a, b) { return issueGreater(a, b) ? 1 : -1; });
        const k = keys[keys.length - 1];
        const d = data.get(k);
        if (d === undefined || d === '' || d === null) { el.textContent = '—'; return; }
        el.textContent = pad3(k) + ' · ' + d + ' ' + (Number(d) >= 5 ? 'LỚN' : 'NHỎ');
    }
    function betPaintTop() {
        try {
            betSettle();
            betRender();
            paintLastLabel();
            betAutoTry();
        } catch (e) {}
    }

    function betPlace(side, mode) {
        const stake = betState.levels[betState.lv] || 0;
        if (!stake) { betStatus('chưa có mức cược hợp lệ', 'warn'); return; }
        if (betState.pending) {
            betStatus('đang chờ kết quả kỳ ' + pad3(betState.pending.issue) + ' — chờ ra số rồi đặt tiếp', 'warn');
            return;
        }
        if (stake > betState.bal) {
            betStatus('vốn không đủ cho mức ' + betFmt(stake) + ' (còn ' + betFmt(betState.bal) + ')', 'warn');
            return;
        }
        const issue = betNextOpenIssue() || betNewestIssue();
        if (!issue) { betStatus('chưa có kỳ nào để đặt cược', 'warn'); return; }
        if (data.has(String(issue))) { betStatus('kỳ ' + pad3(issue) + ' đã có kết quả — chờ kỳ mới', 'warn'); return; }
        betState.bal -= stake;
        betState.pending = {
            issue: String(issue), side: side, lv: betState.lv, stake: stake,
            mode: (mode === 'rule' || betState.mode === 'rule') ? 'rule' : 'normal'
        };
        betSave();
        betRender();
        betStatus('đã đặt ' + (side === 'big' ? 'LỚN' : 'NHỎ') + ' ' + betFmt(stake)
            + ' vào kỳ ' + pad3(issue) + ' · mức ' + (betState.lv + 1)
            + (betState.pending.mode === 'rule' ? ' · nhánh gỡ x-4/x-3' : '')
            + ' · chờ kết quả…', '');
    }

    function betApplyLevels(text) {
        const list = String(text || '').split(/[,;\/\s]+/).map(betCoin).filter(function (v) { return v > 0; });
        if (!list.length) { betStatus('mức cược không hợp lệ — nhập theo nghìn, ví dụ: 10 25 60 600 1200', 'warn'); return; }
        betState.levels = list.slice(0, 12);
        if (betState.lv >= betState.levels.length) betState.lv = 0;
        betSave(); betRender();
        betStatus('đã lưu ' + betState.levels.length + ' mức cược (đơn vị nghìn) · mức 1 = ' + betFmt(betState.levels[0]), 'win');
        try { betCfgOpen(false); } catch (e) {}
    }

    // ===== TỰ ĐỘNG CƯỢC =====
    function betAutoLabel() {
        const btn = $('ebAutoOn');
        if (btn) {
            btn.textContent = betState.auto ? 'TỰ ĐỘNG: BẬT · bấm để tắt' : 'BẬT TỰ ĐỘNG CƯỢC';
            if (betState.auto) btn.setAttribute('data-on', '1'); else btn.removeAttribute('data-on');
        }

    }

    function betAutoTry() {
        betAutoLabel();
        if (!betState.auto) return;
        if (betState.pending) return;
        // chỉ đặt khi có kỳ đang mở thật (chưa có kết quả)
        const open = betNextOpenIssue();
        if (!open || data.has(String(open))) {
            if (!open) betStatus('TỰ ĐỘNG đang bật · chưa xác định được kỳ sắp mở', 'warn');
            return;
        }
        let pick = null;
        try { pick = betNextPick(); } catch (e) {}
        if (!pick || !pick.side || pick.locked) return;
        const stake = betState.levels[betState.lv] || 0;
        if (!stake || stake > betState.bal) {
            betStatus('TỰ ĐỘNG đang bật nhưng vốn không đủ mức ' + betFmt(stake) + ' (còn ' + betFmt(betState.bal) + ')', 'warn');
            return;
        }
        betPlace(pick.side === '1' ? 'big' : 'small', betState.mode);
        betStatus('TỰ ĐỘNG: đã đặt ' + (pick.side === '1' ? 'LỚN' : 'NHỎ') + ' '
            + betFmt(stake) + ' vào kỳ ' + pad3(open) + ' · chờ kết quả', '');
    }

    function betCfgOpen(open) {
        const box = $('ebCfgBox'), mini = $('ebCfgMini');
        if (!box || !mini) return;
        box.hidden = !open;
        mini.hidden = !!open;
        if (open) {
            const cfg = $('ebCfg');
            if (cfg) { try { cfg.focus(); cfg.select(); } catch (e) {} }
        }
    }

    function betInit() {
        betLoad();
        if ($('ebAutoOn')) $('ebAutoOn').addEventListener('click', function () {
            betState.auto = !betState.auto;
            betSave();
            betAutoLabel();
            if (betState.auto) {
                betStatus('đã BẬT tự động cược — mỗi kỳ sẽ tự đặt theo logic', 'win');
                try { betAutoTry(); } catch (e) {}
            } else {
                betStatus('đã TẮT tự động — app sẽ không tự đặt nữa', 'warn');
            }
        });
        if ($('ebAuto')) $('ebAuto').addEventListener('click', function () {
            let pick = null;
            try { pick = betNextPick(); } catch (e) {}
            if (!pick || !pick.side) { betStatus('chưa đủ dữ liệu để tính nước đi', 'warn'); return; }
            if (pick.locked) { betStatus(pick.why, 'warn'); return; }
            betPlace(pick.side === '1' ? 'big' : 'small', betState.mode);
        });
        if ($('ebUndo')) $('ebUndo').addEventListener('click', function () {
            const p = betState.pending;
            if (!p) { betStatus('không có kỳ nào đang chờ để huỷ', 'warn'); return; }
            betState.bal += p.stake;
            betState.pending = null;
            betSave(); betRender();
            betStatus('đã huỷ cược kỳ ' + pad3(p.issue) + ' · hoàn ' + betFmt(p.stake), 'warn');
        });
        if ($('ebPrev')) $('ebPrev').addEventListener('click', function () {
            if (betState.pending) { betStatus('đang chờ kết quả — chưa đổi mức được', 'warn'); return; }
            betState.lv = Math.max(0, betState.lv - 1); betSave(); betRender();
        });
        if ($('ebNext')) $('ebNext').addEventListener('click', function () {
            if (betState.pending) { betStatus('đang chờ kết quả — chưa đổi mức được', 'warn'); return; }
            betState.lv = Math.min(betState.levels.length - 1, betState.lv + 1); betSave(); betRender();
        });
        if ($('ebSaveCfg')) $('ebSaveCfg').addEventListener('click', function () {
            betApplyLevels($('ebCfg') ? $('ebCfg').value : '');
        });
        if ($('ebCfg')) $('ebCfg').addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') { ev.preventDefault(); betApplyLevels(this.value); }
        });
        if ($('ebCfgMini')) $('ebCfgMini').addEventListener('click', function () { betCfgOpen(true); });
        if ($('ebReset')) $('ebReset').addEventListener('click', function () {
            betState.bal = BET_START; betState.lv = 0; betState.pending = null; betState.hist = [];
            betState.mode = 'normal'; betState.ruleLoss = 0; betState.auto = false;
            betSave(); betRender();
            betStatus('đã đặt lại vốn ' + betFmt(BET_START), 'win');
        });
        // một lần duy nhất: bật sẵn chế độ tự động cho bản này
        try {
            if (!localStorage.getItem('vn168_auto_v3')) {
                localStorage.setItem('vn168_auto_v3', '1');
                betState.auto = true;
                betSave();
            }
        } catch (e) {}
        betRender();
        betAutoLabel();
        try { betSettle(); } catch (e) {}
        try {
            if (localStorage.getItem(BET_LS)) betCfgOpen(false);
        } catch (e) {}
    }

    // =====================================================================
    //  KHỞI ĐỘNG
    // =====================================================================
    function init() {
        try { perRow = Math.max(2, Math.min(200, Number(localStorage.getItem(LS_COLS)) || 5)); } catch (e) {}
        try { bitMode = localStorage.getItem(LS_BIT) === 'odd' ? 'odd' : 'big'; } catch (e) {}
        try { pattern = String(localStorage.getItem(LS_PAT) || '').replace(/[^01]/g, ''); } catch (e) {}

        loadData();

        buildGrid();
        applyPattern(pattern);
        try { fillFindLen(); } catch (e) {}
        // ---- khung tìm theo dãy: 5 ô nhị phân 40×40 ----
        fillFindLen();
        $('findLen').addEventListener('change', function () {
            const L = Number(this.value) || perRow;
            findState.len = L;
            findState.cells = findState.cells.slice(0, L);
            while (findState.cells.length < L) findState.cells.push('');
            syncFindFromCells();
        });
        $('findClear').addEventListener('click', function () {
            findState.cells = [];
            findState.seq = '';
            findState.rows = [];
            findState.oppRows = [];
            renderFindCells();
            doFind();
            try { paint(); } catch (e) {}
        });

        // ---- khung kết quả: nút ✎ mở ra, nút lưu thu gọn ----
        $('resEdit').addEventListener('click', function () {
            setResOpen($('resWrap').getAttribute('data-open') !== '1');
        });
        $('resSave').addEventListener('click', function () {
            setResOpen(false);
            setStatus('Đã lưu mẫu ' + (pattern || '(trống)') + ' · khung kết quả thu gọn thành 1 nút.', 'ok');
        });
        try { betInit(); } catch (e) {}
        // khôi phục trạng thái thu gọn đã lưu
        try { if (localStorage.getItem(LS_RES_MINI) === '1') setResOpen(false); else setResOpen(true); } catch (e) {}

        // (danh sách vị trí đã gộp — bấm từng dòng để nhảy tới hàng đó)


        // Firebase trước (không cần token) → có bảng là hiện ngay
        fbInit();
        fbSubscribe();

        clockStart();
        autoStart();

        // có sẵn bảng (máy/Firebase) thì chỉ xin trang mới nhất; bảng trống mới nạp đủ 2000 kỳ
        if (data.size) tailRefresh();           // có bảng sẵn → chỉ xin trang mới nhất (không cần token)
        else setTimeout(doFetch, 600);          // bảng trống → nạp ngay (kể cả không có token)
        if (data.size) {
            setStatus('Đã nạp ' + data.size + ' kỳ đã lưu trên máy · đang chờ đồng bộ Firebase…', 'ok');
        } else if (fbReady) {
            setStatus('Đang chờ bảng từ Firebase (không cần token)…', '');
        } else {
            setStatus('Không kết nối được Firebase — bấm «Token» để tự nạp kết quả.', 'warn');
        }
    }

    init();
})();
</script>
